name: 💡 Feature Request
description: Suggest an idea or new feature for CodeGraph 3D
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: Feature Proposal
      description: What feature or enhancement would you like to see?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Motivation & Use Case
      description: Why is this feature beneficial to software architects and developers?
    validations:
      required: false
