[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraph-galaxy"
version = "2.1.0"
description = "Interactive 3D Galaxy visualization and code intelligence explorer for CodeGraph databases"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "CodeGraph Galaxy Team" }
]
keywords = [
    "codegraph",
    "galaxy",
    "visualization",
    "3d",
    "ast",
    "code-intelligence",
    "threejs",
    "webgl",
    "electron"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Visualization"
]
dependencies = [
    "Flask>=2.0.0",
    "requests>=2.25.0"
]

[project.scripts]
codegraph-galaxy = "codegraph_galaxy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codegraph_galaxy*"]

[tool.setuptools.package-data]
codegraph_galaxy = ["templates/*.html", "static/*"]
