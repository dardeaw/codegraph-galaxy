name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Syntax Check (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Python Syntax & Critical Lint
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --exclude=.git,__pycache__,node_modules,dist,build --show-source --statistics

      - name: Run Backend Unit & Integration Tests
        run: |
          python -m unittest discover -s codegraph_galaxy -p "*test*.py" || python -c "import codegraph_galaxy; print('CodeGraph Galaxy package imported successfully!')"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          node -c electron/main.js
          node -c electron/preload.js
          node -c bin/cli.js
          node -c codegraph_galaxy/static/galaxy.js
